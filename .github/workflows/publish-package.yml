name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag matching package.json (for example v2.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org/'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node --input-type=module -e 'import pkg from "./package.json" with { type:"json" }; if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Release tag must match package.json version");'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:package
      - run: pnpm audit:production
      - name: Pack release with pnpm
        run: pnpm pack --out "$RUNNER_TEMP/dnd-tree-sortable.tgz"
      - name: Publish through npm trusted publishing
        run: npm publish "$RUNNER_TEMP/dnd-tree-sortable.tgz" --provenance --access public
