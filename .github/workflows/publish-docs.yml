name: Deploy Documentation

# Run this workflow when pushing to the default branch
on:
  push:
    branches:
      - master # Change this to your default branch (e.g., 'master')

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Use your preferred Node.js version

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the documentation
      - name: Build docs
        run: npm run build-docs # Replace with your docs build command (e.g., vite-pages or vite build)

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}
          publish_dir: ./docs/dist # Change to the directory where your docs are built
